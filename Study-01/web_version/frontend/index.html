<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Digit Recognition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Handwritten Digit Recognition</h1>
        <p class="subtitle">Draw a digit (0-9) on the canvas and click "Recognize"</p>

        <div class="canvas-container">
            <canvas id="drawingCanvas" width="280" height="280"></canvas>
        </div>

        <div class="button-container">
            <button id="recognizeBtn" class="btn btn-primary">Recognize Digit</button>
            <button id="clearBtn" class="btn btn-secondary">Clear Canvas</button>
        </div>

        <div id="resultContainer" class="result-container" style="display: none;">
            <div class="result">
                <h2>Result</h2>
                <p class="digit-result">Predicted Digit: <span id="digitResult">-</span></p>
                <p class="confidence-result">Confidence: <span id="confidenceResult">-</span>%</p>
                <div class="probabilities" id="probabilitiesContainer"></div>
            </div>
        </div>

        <div id="loadingContainer" class="loading-container" style="display: none;">
            <p>Processing...</p>
            <div class="spinner"></div>
        </div>

        <div id="errorContainer" class="error-container" style="display: none;">
            <p id="errorMessage">Error</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
